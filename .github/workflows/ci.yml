name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows quality gate
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            plugins/token-holdem/mcp/package-lock.json

      - name: Report pinned toolchains
        shell: pwsh
        run: |
          rustup show active-toolchain
          rustc --version
          node --version
          npm --version

      - name: Check Rust formatting and lints
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Rust tests
        shell: pwsh
        run: cargo test --workspace --locked

      - name: Build sidecar and fuzz targets
        shell: pwsh
        run: |
          cargo build --locked -p token-holdem-sidecar
          cargo check --manifest-path fuzz/Cargo.toml --bins --locked

      - name: Build and test UI
        working-directory: ui
        shell: pwsh
        run: |
          npm ci
          npm run build
          npm run lint
          npm test

      - name: Build and test Codex plugin
        working-directory: plugins/token-holdem/mcp
        shell: pwsh
        run: |
          npm ci
          npm run build
          npm test

      - name: Validate scripts and source language
        shell: pwsh
        run: |
          ./scripts/check-syntax.ps1
          ./scripts/install-plugin.ps1 -ValidateOnly
          ./scripts/test-installer-entrypoint.ps1
          ./scripts/test-codex-runtime-resolution.ps1
          ./scripts/test-forward-update-contract.ps1
          python -m py_compile scripts/build-plugin.py
          python -m py_compile scripts/check-rust-security-baseline.py
          python -m py_compile scripts/set-version.py
          python scripts/check-rust-security-baseline.py
          python scripts/check-source-language.py
          node --test scripts/community-network.test.mjs

      - name: Verify volunteer networking and complete sessions
        shell: pwsh
        run: |
          node scripts/verify-volunteer-network.mjs
          node scripts/verify-p2p-hand.mjs
          node scripts/verify-dynamic-table.mjs
          node scripts/verify-complete-session.mjs
