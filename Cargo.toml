[workspace]
members = [
    "crates/token-holdem-domain",
    "crates/token-holdem-identity",
    "crates/token-holdem-application",
    "crates/token-holdem-mental-poker",
    "crates/token-holdem-network",
    "crates/token-holdem-sidecar",
]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "0.4.17"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
argon2 = "0.5"
ark-serialize = "0.5"
ark-std = "0.5"
async-trait = "0.1"
base64 = "0.22"
blake3 = "1.5"
chacha20poly1305 = "0.10"
cbor4ii = { version = "0.3", features = ["serde1", "use_std"] }
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde", "zeroize"] }
futures = "0.3"
hex = "0.4"
libp2p = { git = "https://github.com/libp2p/rust-libp2p", rev = "170c3c81ddd80e7c58b0500563e00a09139e8545", features = [
    "autonat",
    "cbor",
    "dcutr",
    "dns",
    "gossipsub",
    "identify",
    "kad",
    "macros",
    "noise",
    "ping",
    "quic",
    "relay",
    "rendezvous",
    "request-response",
    "tcp",
    "tokio",
    "upnp",
    "yamux",
] }
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.40", features = ["io-std", "io-util", "macros", "rt-multi-thread", "signal", "sync"] }
tokio-util = { version = "0.7", features = ["codec"] }
zeroize = "1.8"
ziffle = "0.1"
